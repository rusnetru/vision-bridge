<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101A2E"/>
      <stop offset="1" stop-color="#0A0F1C"/>
    </linearGradient>
    <linearGradient id="accent" gradientUnits="userSpaceOnUse" x1="136" y1="180" x2="376" y2="380">
      <stop offset="0" stop-color="#38E1C6"/>
      <stop offset="1" stop-color="#4F8BFF"/>
    </linearGradient>
  </defs>

  <!-- tile -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- app window: frame + title bar -->
  <rect x="80" y="104" width="352" height="304" rx="40" fill="none" stroke="#2C3D60" stroke-width="22"/>
  <line x1="91" y1="174" x2="421" y2="174" stroke="#2C3D60" stroke-width="22"/>
  <circle cx="132" cy="139" r="9" fill="#2C3D60"/>
  <circle cx="162" cy="139" r="9" fill="#2C3D60"/>

  <!-- eye -->
  <path d="M128 291 Q256 182 384 291 Q256 400 128 291 Z" fill="none" stroke="url(#accent)" stroke-width="24" stroke-linejoin="round"/>

  <!-- pupil = element bounding box with focus dot -->
  <rect x="220" y="255" width="72" height="72" rx="18" fill="#0E1628" stroke="url(#accent)" stroke-width="20"/>
  <circle cx="256" cy="291" r="14" fill="#E8FFF9"/>
</svg>
